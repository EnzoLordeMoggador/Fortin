<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Fortin - Cadê meu celular?</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#101327;color:#fff;font-family:system-ui,sans-serif;background-image:radial-gradient(ellipse at 50% 36%,#27315a,transparent 66%)}main{width:min(96%,650px);text-align:center;padding:24px 12px}h1{font-size:clamp(25px,5vw,38px);margin:0;color:#ffdb67}p{color:#c9bfdc;margin:8px 0 0}.stage{position:relative}svg{width:100%;height:auto;max-height:70svh;overflow:visible}.hero{transform-origin:300px 490px;animation:breathe 3s ease-in-out infinite}.eyelids{animation:blink 5s infinite;transform-origin:300px 170px}.spark{animation:twinkle 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spark:nth-child(2){animation-delay:.6s}.duvida .hero{animation:search .75s ease-in-out 2}.duvida .spark{animation:twinkle .35s infinite}.duvida .normal-face{display:none}.doubt-face{display:none}.duvida .doubt-face{display:inline}.duvida .question{opacity:1;transform:translateY(0)}button{border:0;background:#ffdb67;color:#282038;padding:14px 24px;border-radius:99px;font:700 16px system-ui;cursor:pointer;box-shadow:0 6px 0 #a87830;transition:transform .15s}button:hover{transform:translateY(-2px)}button:active{transform:translateY(4px);box-shadow:0 2px 0 #a87830}button:focus-visible{outline:3px solid white;outline-offset:6px}#fala{min-height:28px;margin:20px 0 0;font-weight:600;color:#f4e7ff}.question{opacity:0;transition:.25s;transform:translateY(12px);font:900 54px system-ui;fill:#ffdb67;stroke:#6a471a;stroke-width:2px}@keyframes breathe{50%{transform:translateY(-4px) scale(1.008)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}@keyframes twinkle{50%{transform:scale(.6);opacity:.35}}@keyframes search{25%{transform:translateX(-8px) rotate(-2deg)}65%{transform:translateX(10px) rotate(2deg)}}@media(prefers-reduced-motion:reduce){.hero,.eyelids,.spark,.duvida .hero,.duvida .spark{animation:none}button{transition:none}}
</style>
</head>

<ellipse cx="275" cy="166" rx="6" ry="8" fill="#302128" stroke="none"/><ellipse cx="327" cy="166" rx="6" ry="8" fill="#302128" stroke="none"/>

</g>

</g>
</svg>
</div>
<button id="botao" type="button">Cadê meu celular?</button>
<p id="fala" aria-live="polite">"Eu deixei ele aqui... eu acho."</p>
</main>
<script>
const palco=document.getElementById('palco');
const fala=document.getElementById('fala');
const frases=['"Eu deixei ele aqui... eu acho."','"Alguém viu meu celular?"','"Tá no bolso? Não. No outro? Também não."','"Se ele tocar agora eu finjo que sabia."','"Pera... será que eu tô segurando?"'];
let indice=0,temporizador;
document.getElementById('botao').addEventListener('click',()=>{
 indice=(indice+1)%frases.length;
 fala.textContent=frases[indice];
 palco.classList.remove('duvida');
 void palco.offsetWidth;
 palco.classList.add('duvida');
 clearTimeout(temporizador);
 temporizador=setTimeout(()=>palco.classList.remove('duvida'),1800);
});
</script>
</body>
</html>
